name: Enviar Noticias Telegram

on:
  workflow_dispatch: # Permite ejecutarlo manualmente
  schedule:
    - cron: '0 12 * * *' # Ejemplo de ejecución programada

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          playwright install --with-deps chromium # <-- AGREGAR ESTA LÍNEA

      - name: Ejecutar script de envío
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CNE_EMAIL: ${{ secrets.CNE_EMAIL }}
          CNE_PASSWORD: ${{ secrets.CNE_PASSWORD }}
          FORZAR_ENVIO: "true" # Obliga al script a enviar la prueba ahora mismo
        run: |
          python scripts/enviar_noticias.py
