name: Enviar Noticias Boletin

on:
  schedule:
    # 9:00 y 21:00 hora Chile — cubre horario de verano (UTC-3) e invierno (UTC-4)
    - cron: '0 12,13,0,1 * * *'
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar script de envío
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CNE_EMAIL: ${{ secrets.CNE_EMAIL }}
          CNE_PASSWORD: ${{ secrets.CNE_PASSWORD }}
          TZ: "America/Santiago"
          FORZAR_ENVIO: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python scripts/enviar_noticias.py
