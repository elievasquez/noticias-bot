# Ventana de tolerancia en minutos alrededor del objetivo (ej. ±30 minutos)
TOLERANCIA_MINUTOS = 30

def edicion_objetivo(ahora):
    """
    Determina si 'ahora' cae dentro de la ventana de envío de alguna edición.
    Devuelve 'manana', 'noche' o None si no corresponde enviar todavía.

    Objetivos:
      - 09:00 -> 'manana'
      - 00:10 -> 'noche'  (medianoche + 10 min)
    La comparación usa tolerancia simétrica (±TOLERANCIA_MINUTOS).
    """
    minutos_ahora = ahora.hour * 60 + ahora.minute
    objetivos = (
        (9 * 60 + 0, "manana"),   # 09:00 => 540
        (0 * 60 + 10, "noche"),   # 00:10 => 10
    )
    for objetivo_minutos, nombre in objetivos:
        if abs(minutos_ahora - objetivo_minutos) <= TOLERANCIA_MINUTOS:
            return nombre
    return None
