name: Enviar Noticias Boletin
on:
  schedule:
    # 09:00 AM Chile (12:00 UTC en Verano / 13:00 UTC en Invierno) - Todos los días
    - cron: '0 12,13 * * *'
    # 00:00 AM Chile (03:00 UTC en Verano / 04:00 UTC en Invierno) - Todos los días
    - cron: '0 3,4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Debug horario y presencia de secrets  # temporal, eliminar después de probar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CNE_EMAIL: ${{ secrets.CNE_EMAIL }}
          CNE_PASSWORD: ${{ secrets.CNE_PASSWORD }}
          TZ: "America/Santiago"
          FORZAR_ENVIO: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python - <<'PY'
          import os, datetime, zoneinfo
          ahora = datetime.datetime.now(zoneinfo.ZoneInfo("America/Santiago"))
          minutos = ahora.hour * 60 + ahora.minute
          print("Ahora Chile:", ahora.isoformat())
          print("Minutos hoy:", minutos)
          for h,name in ((9,'manana'),(0,'noche')):
              objetivo = h * 60
              print(f"objetivo {h:02d}:00 -> diff = {minutos - objetivo} minutos | abs diff = {abs(minutos - objetivo)}")
          print("FORZAR_ENVIO:", os.getenv("FORZAR_ENVIO"))
          print("TELEGRAM_BOT_TOKEN set?:", bool(os.getenv("TELEGRAM_BOT_TOKEN")))
          print("TELEGRAM_CHAT_ID set?:", bool(os.getenv("TELEGRAM_CHAT_ID")))
          PY
      - name: Ejecutar script de envío
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CNE_EMAIL: ${{ secrets.CNE_EMAIL }}
          CNE_PASSWORD: ${{ secrets.CNE_PASSWORD }}
          TZ: "America/Santiago"
          FORZAR_ENVIO: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python scripts/enviar_noticias.py
      - name: Guardar estado de último envío
        if: always()
        run: |
          if [ -f estado_envio.json ] && [ -n "$(git status --porcelain estado_envio.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Obtener nombre de la rama (ej. "main") y asegurarnos de estar en ella
            BRANCH="${GITHUB_REF#refs/heads/}"
            git checkout "$BRANCH" || true

            git add estado_envio.json
            # Commit sólo si hay cambios (el commit fallará si no hay cambios y se ignora con || true)
            git commit -m "chore: actualizar estado de último envío [skip ci]" || true

            # Sincronizar y pushear. Si la push falla (por protección de rama), avisamos.
            git pull --rebase origin "$BRANCH" || true
            git push origin "$BRANCH" || {
              echo "Push falló. Si la rama tiene protección, configura un PAT en secrets (REPO_PUSH_TOKEN) y actualiza el remote para usarlo."
              exit 0
            }
          else
            echo "Sin cambios en estado_envio.json, nada que commitear."
          fi
